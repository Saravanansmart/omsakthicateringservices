<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Om Sakthi Catering Services emblem">
  <defs>
    <radialGradient id="osTile" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#FDF8F0"/>
    </radialGradient>
    <linearGradient id="omMaroon" x1="32" y1="8" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#932828"/>
      <stop offset="1" stop-color="#6C1717"/>
    </linearGradient>
    <linearGradient id="omGold" x1="16" y1="4" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6B44A"/>
      <stop offset="1" stop-color="#C9A24B"/>
    </linearGradient>
  </defs>

  <!-- Emblem tile -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#osTile)" stroke="#C9A24B" stroke-width="1.5"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="13" fill="none" stroke="#C9A24B" stroke-width="0.9" stroke-opacity="0.5"/>

  <!-- Om (Aum) mark, hand-drawn as a vector glyph so it renders identically everywhere -->
  <g transform="translate(-8.4 4.8) scale(0.6)" stroke-linecap="round" fill="none">
    <!-- Bindu (dot) -->
    <circle cx="65" cy="8" r="3.6" fill="url(#omGold)"/>
    <!-- Chandrabindu (crescent) -->
    <path d="M43 20 Q 65 36 87 20" stroke="url(#omGold)" stroke-width="6"/>
    <!-- Main body sweep -->
    <path d="M50 30 A 13 11 0 1 1 50 55" stroke="url(#omMaroon)" stroke-width="6.5"/>
    <path d="M50 55 A 16 14 0 1 1 50 84" stroke="url(#omMaroon)" stroke-width="6.5"/>
    <path d="M50 84 C 58 90, 62 82, 67 77" stroke="url(#omMaroon)" stroke-width="6.5"/>
    <circle cx="78" cy="66" r="14" stroke="url(#omMaroon)" stroke-width="6.5"/>
    <path d="M89 55 C 97 49, 100 58, 91 63" stroke="url(#omMaroon)" stroke-width="6"/>
  </g>
</svg>
